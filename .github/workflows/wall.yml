# The house's eyes on the Mac wall: build chintan's Catalyst destination on
# yantar, open it full screen against the real house when nobody is at that
# desk, photograph it at rest and with the painting alone (wall.sh), and
# hand the pictures back. Dispatched by the house (2026-09-27).
name: wall

on:
  workflow_dispatch:
    inputs:
      wait:
        description: seconds to let the wall settle before the photograph
        default: "30"
      idle:
        description: seconds yantar must have been untouched (the house lowers it only when its desk sensor says Prab is at chintan)
        default: "600"

concurrency:
  group: chintan-yantar
  cancel-in-progress: false

jobs:
  wall:
    runs-on: [self-hosted, macOS, yantar]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Look
        env:
          CHINTAN_HOUSE: ${{ secrets.CHINTAN_HOUSE }}
          WALL_WAIT: ${{ inputs.wait }}
          WALL_IDLE: ${{ inputs.idle }}
        run: bash Chintan/scripts/see.sh --wall "$RUNNER_TEMP/wall"
      - uses: actions/upload-artifact@v4
        with:
          name: wall
          path: ${{ runner.temp }}/wall/*.png
          retention-days: 3
      - name: Sweep
        if: always()
        run: rm -rf "$RUNNER_TEMP/wall"
