# The house's eyes on chintan, the private app: build for the simulator on
# yantar, photograph every tab in light and dark against the real house
# (Chintan/scripts/see.sh), and hand the pictures back as an artifact.
name: screens

on:
  workflow_dispatch:

concurrency:
  group: chintan-yantar
  cancel-in-progress: false

jobs:
  screens:
    runs-on: [self-hosted, macOS, yantar]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Look
        env:
          CHINTAN_HOUSE: ${{ secrets.CHINTAN_HOUSE }}
        run: bash Chintan/scripts/see.sh "$RUNNER_TEMP/shots"
      - uses: actions/upload-artifact@v4
        with:
          name: screens
          path: ${{ runner.temp }}/shots/*.png
          retention-days: 3
      - name: Sweep
        if: always()
        run: rm -rf "$RUNNER_TEMP/shots"
