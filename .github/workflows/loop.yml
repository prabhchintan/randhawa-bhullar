# The loop, running where nothing depends on the maintainer's Mac: a
# GitHub-hosted macOS runner with Xcode, cktool and the App Store Connect key,
# driving a headless coding agent with loop/SESSION.md as its prompt. LOOP.md
# is the covenant that session runs under.
#
# Cadence: Wednesdays and Sundays at 15:00 UTC (10:00 Austin, 09:00 Denver),
# roughly every three or four days, gentle on a Claude subscription. Sunday
# is the weekly summary day; other runs write to the maintainer only when
# something happened. Change the cron here to change the cadence; the
# Saturday question is a cron on the Cloudflare worker (worker/wrangler.toml
# in the prabhchintan.com repo).
#
# The agent is chosen by the repository variable LOOP_AGENT:
#   claude (default)  Claude Code, secret CLAUDE_CODE_OAUTH_TOKEN (the
#                     maintainer's subscription) or ANTHROPIC_API_KEY;
#                     LOOP_MODEL picks the model (leave empty for the
#                     plan's default; a smaller plan may want claude-sonnet-5)
#   codex             OpenAI Codex CLI; with LOOP_MODEL_PROVIDER=xai and secret
#                     XAI_API_KEY it runs Grok, with OPENAI_API_KEY it runs
#                     OpenAI models. LOOP_MODEL names the model.
# The prompt, the tools and the covenant are the same whichever agent runs.
#
# Secrets: one of the agent keys above, plus ASC_KEY_ID, ASC_ISSUER_ID,
# ASC_KEY_P8, ASC_CONTACT_JSON, CKTOOL_USER_TOKEN, LOOP_DEPLOY_KEY (write
# deploy key for the private repo), SITE_DEPLOY_KEY (write deploy key for
# the website repo), CLOUDFLARE_API_TOKEN (the site's zone and workers) and
# LOOP_SECRET (the mail relay).
name: Loop

on:
  schedule:
    - cron: "0 15 * * 0,3"
  workflow_dispatch:
    inputs:
      mode:
        description: "full runs the session; check only proves the runner (toolchain, keys, feeds, builds)"
        type: choice
        options: [full, check]
        default: full
      note:
        description: "One line handed to the session as an extra instruction (optional)"
        type: string
        default: ""

concurrency:
  group: loop
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  loop:
    runs-on: macos-15
    timeout-minutes: 300
    env:
      LOOP_PRIVATE: ${{ github.workspace }}/../randhawa-loop
      SITE: ${{ github.workspace }}/../prabhchintan.com
      LOOP_AGENT: ${{ vars.LOOP_AGENT || 'claude' }}
      LOOP_MODEL: ${{ vars.LOOP_MODEL }}
      LOOP_MODEL_PROVIDER: ${{ vars.LOOP_MODEL_PROVIDER }}
      HOMEBREW_NO_AUTO_UPDATE: 1
    steps:
      # The kill switch: set the repository variable LOOP_PAUSED to 1 and every
      # run ends here, quietly, until it is unset. Disabling the workflow in
      # the Actions tab does the same.
      - name: Paused?
        if: ${{ vars.LOOP_PAUSED == '1' }}
        run: |
          echo "LOOP_PAUSED is set; nothing runs."
          exit 0

      - name: Check out the apps
        if: ${{ vars.LOOP_PAUSED != '1' }}
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check out the private loop repo
        if: ${{ vars.LOOP_PAUSED != '1' }}
        env:
          LOOP_DEPLOY_KEY: ${{ secrets.LOOP_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$LOOP_DEPLOY_KEY" > ~/.ssh/loop_deploy_key
          chmod 600 ~/.ssh/loop_deploy_key
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/loop_deploy_key -o IdentitiesOnly=yes"
          git clone git@github.com:prabhchintan/randhawa-loop.git "$LOOP_PRIVATE"
          echo "GIT_SSH_COMMAND=$GIT_SSH_COMMAND" >> "$GITHUB_ENV"
          git -C "$LOOP_PRIVATE" config user.name "The loop"
          git -C "$LOOP_PRIVATE" config user.email "loop@pulse.prabhchintan.com"
          git config user.name "The loop"
          git config user.email "loop@pulse.prabhchintan.com"

      # The website is the loop's other subject. Its own deploy key; its own
      # tempo (a push to main deploys it, so site work goes out at once).
      - name: Check out the website
        if: ${{ vars.LOOP_PAUSED != '1' }}
        env:
          SITE_DEPLOY_KEY: ${{ secrets.SITE_DEPLOY_KEY }}
        run: |
          printf '%s\n' "$SITE_DEPLOY_KEY" > ~/.ssh/site_deploy_key
          chmod 600 ~/.ssh/site_deploy_key
          # One SSH config, two keys, so git picks the right one per host alias.
          cat >> ~/.ssh/config <<EOF
          Host github.com-loop
            HostName github.com
            IdentityFile ~/.ssh/loop_deploy_key
            IdentitiesOnly yes
          Host github.com-site
            HostName github.com
            IdentityFile ~/.ssh/site_deploy_key
            IdentitiesOnly yes
          EOF
          # From here on the config picks the key per host alias, so the
          # earlier pinned command must not win.
          export GIT_SSH_COMMAND=ssh
          git -C "$LOOP_PRIVATE" remote set-url origin git@github.com-loop:prabhchintan/randhawa-loop.git
          git clone git@github.com-site:prabhchintan/prabhchintan.com.git "$SITE"
          git -C "$SITE" config user.name "The loop"
          git -C "$SITE" config user.email "loop@pulse.prabhchintan.com"
          echo "GIT_SSH_COMMAND=ssh" >> "$GITHUB_ENV"
          pip3 install --quiet --break-system-packages -r "$SITE/requirements.txt" 2>&1 | tail -1 || true

      - name: Pick the newest Xcode on the runner
        if: ${{ vars.LOOP_PAUSED != '1' }}
        run: |
          NEWEST=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$NEWEST"
          xcodebuild -version | head -1
          swift --version 2>&1 | head -1

      - name: Install the keys
        if: ${{ vars.LOOP_PAUSED != '1' }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_CONTACT_JSON: ${{ secrets.ASC_CONTACT_JSON }}
          CKTOOL_USER_TOKEN: ${{ secrets.CKTOOL_USER_TOKEN }}
        run: |
          mkdir -p ~/.config/appstoreconnect
          printf '%s\n' "$ASC_KEY_P8" > ~/.config/appstoreconnect/AuthKey_$ASC_KEY_ID.p8
          printf '%s\n' "$ASC_CONTACT_JSON" > ~/.config/appstoreconnect/contact.json
          printf '{"key_id": "%s", "issuer_id": "%s", "key_path": "%s/.config/appstoreconnect/AuthKey_%s.p8", "team_id": "7FWNAT83XU"}\n' \
            "$ASC_KEY_ID" "$ASC_ISSUER_ID" "$HOME" "$ASC_KEY_ID" > ~/.config/appstoreconnect/config.json
          chmod 600 ~/.config/appstoreconnect/*
          printf '%s' "$CKTOOL_USER_TOKEN" > ~/.config/cktool
          chmod 600 ~/.config/cktool
          pip3 install --quiet --break-system-packages "PyJWT[crypto]"
          echo "ASC_KEY_PATH=$HOME/.config/appstoreconnect/AuthKey_$ASC_KEY_ID.p8" >> "$GITHUB_ENV"
          echo "ASC_KEY_ID=$ASC_KEY_ID" >> "$GITHUB_ENV"
          echo "ASC_ISSUER_ID=$ASC_ISSUER_ID" >> "$GITHUB_ENV"

      # This job's log is public, like the repository. Nothing about the
      # maintainer, his map or his words is printed here; all of that goes to
      # the private repo.
      - name: Feeds (map, review state, mail)
        if: ${{ vars.LOOP_PAUSED != '1' }}
        env:
          LOOP_SECRET: ${{ secrets.LOOP_SECRET }}
        run: |
          python3 scripts/asc.py status --app Prabhchintan.Randhawa | head -2
          python3 scripts/asc.py status --app Prabhchintan.Bhullar | head -2
          mkdir -p "$LOOP_PRIVATE/logs" "$LOOP_PRIVATE/inbox" "$LOOP_PRIVATE/feedback"
          # A dead token must not fail the run or leave an empty dated log
          # pretending to be a good read; the last good feed stands and the
          # session reports the staleness. scripts/renewmap.sh on the
          # maintainer's Mac is the renewal.
          if python3 scripts/mymap.py --inbox "$LOOP_PRIVATE/inbox" > /tmp/map.txt; then
            mv /tmp/map.txt "$LOOP_PRIVATE/logs/$(date -u +%F)-map.txt"
            echo "map feed ok"
          else
            rm -f /tmp/map.txt
            echo "map feed failed, likely the short-lived cktool user token; renewmap.sh renews it"
          fi
          NEW=$(python3 scripts/loopmail.py inbox --into "$LOOP_PRIVATE/inbox" | wc -l | tr -d ' ')
          echo "mail: $NEW new"

      - name: Simulator builds (check mode)
        if: ${{ vars.LOOP_PAUSED != '1' && (github.event.inputs.mode == 'check') }}
        run: |
          xcodebuild -project Randhawa.xcodeproj -target Randhawa -sdk iphonesimulator CODE_SIGNING_ALLOWED=NO build 2>&1 | grep -E "error:|BUILD (SUCCEEDED|FAILED)"
          xcodebuild -project Bhullar/Bhullar.xcodeproj -target Bhullar -sdk iphonesimulator CODE_SIGNING_ALLOWED=NO build 2>&1 | grep -E "error:|BUILD (SUCCEEDED|FAILED)"

      - name: Install the agent
        if: ${{ vars.LOOP_PAUSED != '1' && (github.event.inputs.mode != 'check') }}
        run: |
          case "$LOOP_AGENT" in
            claude) npm install -g @anthropic-ai/claude-code && claude --version ;;
            codex)
              npm install -g @openai/codex && codex --version
              mkdir -p ~/.codex
              if [ "$LOOP_MODEL_PROVIDER" = "xai" ]; then
                cat > ~/.codex/config.toml <<EOF
          model = "${LOOP_MODEL:-grok-4}"
          model_provider = "xai"
          [model_providers.xai]
          name = "xAI"
          base_url = "https://api.x.ai/v1"
          env_key = "XAI_API_KEY"
          wire_api = "chat"
          EOF
              else
                printf 'model = "%s"\n' "${LOOP_MODEL:-gpt-5}" > ~/.codex/config.toml
              fi
              ;;
            *) echo "unknown LOOP_AGENT $LOOP_AGENT"; exit 1 ;;
          esac

      - name: Run the session
        if: ${{ vars.LOOP_PAUSED != '1' && (github.event.inputs.mode != 'check') }}
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          LOOP_SECRET: ${{ secrets.LOOP_SECRET }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          LOOP_NOTE: ${{ github.event.inputs.note }}
        run: |
          PROMPT="$(cat loop/SESSION.md)"
          if [ -n "$LOOP_NOTE" ]; then
            PROMPT="$(printf '%s\n\nExtra instruction from the maintainer for this run: %s' "$PROMPT" "$LOOP_NOTE")"
          fi
          LOG="$LOOP_PRIVATE/logs/$(date -u +%F)-session.log"
          set +e
          case "$LOOP_AGENT" in
            claude)
              claude -p "$PROMPT" --dangerously-skip-permissions --output-format stream-json --verbose ${LOOP_MODEL:+--model "$LOOP_MODEL"} 2>&1 \
                | python3 scripts/transcript.py > "$LOG" ;;
            codex)
              codex exec --dangerously-bypass-approvals-and-sandbox "$PROMPT" > "$LOG" 2>&1 ;;
          esac
          STATUS=${PIPESTATUS[0]:-$?}
          set -e
          echo "session ($LOOP_AGENT) exit $STATUS, $(wc -l < "$LOG") lines of transcript in the private repo"
          echo "SESSION_STATUS=$STATUS" >> "$GITHUB_ENV"

      # Whatever happened, the private repo gets the transcript and the
      # maintainer gets one short email if there is something to say. The
      # session writes reports/YYYY-MM-DD.md when it has news; if it wrote
      # one, its Short version is the email. If the session died, that is the
      # email. A quiet day sends nothing.
      - name: Keep the logs and write to the maintainer
        if: ${{ vars.LOOP_PAUSED != '1' && (always()) }}
        env:
          LOOP_SECRET: ${{ secrets.LOOP_SECRET }}
        run: |
          cd "$LOOP_PRIVATE"
          mkdir -p logs inbox feedback reports analytics
          git add -A logs inbox feedback reports analytics
          git diff --cached --quiet || git commit -q -m "Loop $(date -u +%F)"
          git push -q origin HEAD:main || (git pull -q --rebase origin main && git push -q origin HEAD:main)
          cd "$GITHUB_WORKSPACE"
          TODAY=$(date -u +%F)
          REPORT="$LOOP_PRIVATE/reports/$TODAY.md"
          MODE="${{ github.event.inputs.mode }}"
          if [ "$MODE" = "check" ]; then
            echo "check mode, no mail"
          elif [ -f "$REPORT" ] && [ -n "$(python3 scripts/loopmail.py short "$REPORT")" ]; then
            KIND=note; [ "$(date -u +%u)" = "7" ] && KIND=sunday
            python3 scripts/loopmail.py short "$REPORT" | python3 scripts/loopmail.py send --subject "Randhawa" --kind "$KIND" \
              --details "https://github.com/prabhchintan/randhawa-loop/blob/main/reports/$TODAY.md"
          elif [ "${SESSION_STATUS:-0}" != "0" ]; then
            python3 scripts/loopmail.py send --subject "Randhawa, the loop stumbled" --kind failure \
              --line "Nothing for you." \
              --line "Today's run did not finish (agent: $LOOP_AGENT); the next scheduled run starts clean. If this repeats, reply and say so." \
              --details "https://github.com/prabhchintan/randhawa-bhullar/actions/runs/${{ github.run_id }}"
          else
            echo "quiet day, no mail"
          fi

      # A session that stumbles does not turn the run red: the maintainer was
      # told by the loop's own email, and a red run would make GitHub email him
      # too. Only a runner that cannot even start (a failed checkout, a bad
      # key) fails the job, and that alarm should be loud.
      - name: Note the session outcome
        if: ${{ vars.LOOP_PAUSED != '1' && github.event.inputs.mode != 'check' }}
        run: |
          if [ "${SESSION_STATUS:-0}" != "0" ]; then
            echo "::warning::the session exited $SESSION_STATUS; see the transcript in the private repo"
          else
            echo "session finished cleanly"
          fi
